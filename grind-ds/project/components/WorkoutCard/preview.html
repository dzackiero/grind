<!-- @dsCard group="Training" height=420 subtitle="Today's workout, planned and completed" -->
<!doctype html><html><head><meta charset="utf-8"><title>WorkoutCard</title></head><body>
<div class="k-pad">
  <article class="k-card k-workout t-intervals">
    <div class="k-workout__type"><span class="k-tag"></span>Intervals</div>
    <h3 class="k-workout__title">6 × 800m at 10K pace</h3>
    <span class="k-check" role="checkbox" aria-checked="false" aria-label="Mark done"></span>
    <div class="k-workout__meta">Wednesday, Nov 4 · about 48 min</div>
    <div class="k-workout__metrics">
      <div><span class="k-label">Distance</span><b>7.2 km</b></div>
      <div><span class="k-label">Rep pace</span><b>4:10</b></div>
      <div><span class="k-label">Recovery</span><b>90"</b></div>
    </div>
  </article>
  <article class="k-card k-workout t-long">
    <div class="k-workout__type"><span class="k-tag"></span>Long run · done</div>
    <h3 class="k-workout__title">9 km progressive long run</h3>
    <span class="k-check k-check--on" role="checkbox" aria-checked="true" aria-label="Done"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>
    <div class="k-workout__meta">Sunday, Nov 1 · synced from intervals.icu</div>
    <div class="k-workout__metrics">
      <div><span class="k-label">Distance</span><b>9.1 km</b></div>
      <div><span class="k-label">Avg pace</span><b>6:02</b></div>
      <div><span class="k-label">On target</span><b style="color:var(--success)">94%</b></div>
    </div>
  </article>
</div>
</body></html>
