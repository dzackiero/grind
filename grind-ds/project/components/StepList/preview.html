<!-- @dsCard group="Training" height=300 subtitle="Workout steps to copy onto the watch" -->
<!doctype html><html><head><meta charset="utf-8"><title>StepList</title></head><body>
<div class="k-pad">
<ol class="k-steps">
  <li class="k-step t-easy"><b>Warm up</b><span class="k-data">10:00 · 6:30/km</span></li>
  <li class="k-repeat">Repeat 6 times</li>
  <li class="k-step k-step--rep t-intervals"><b>Run</b><span class="k-data">800 m · 4:10/km</span></li>
  <li class="k-step k-step--rep"><b>Recover</b><span class="k-data">1:30 · walk or jog</span></li>
  <li class="k-step t-easy"><b>Cool down</b><span class="k-data">10:00 · easy</span></li>
</ol>
</div>
</body></html>
