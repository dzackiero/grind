<!-- @dsCard group="Foundations" height=120 subtitle="Workout type chips, tag squares and dots" -->
<!doctype html><html><head><meta charset="utf-8"><title>Chip</title></head><body>
<div class="k-pad" style="flex-direction:column">
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <span class="k-chip k-chip--type t-easy">Easy</span><span class="k-chip k-chip--type t-tempo">Tempo</span><span class="k-chip k-chip--type t-intervals">Intervals</span><span class="k-chip k-chip--type t-hills">Hills</span><span class="k-chip k-chip--type t-long">Long run</span><span class="k-chip k-chip--type t-race">Race</span><span class="k-chip k-chip--type t-strength">Strength</span><span class="k-chip k-chip--type t-recovery">Mobility</span>
  </div>
  <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <span class="k-chip k-chip--done">Completed</span><span class="k-chip">40–50 min</span>
    <span class="k-tag t-easy"></span><span class="k-tag t-intervals"></span><span class="k-tag t-long"></span><span class="k-tag k-tag--split"></span>
    <span class="k-dot t-strength"></span><span class="k-dot t-tempo"></span><span class="k-dot t-race"></span>
  </div>
</div>
</body></html>
