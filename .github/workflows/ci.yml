name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Catches build-only failures before Vercel does. Needs no env: the build passes without any secrets or DATABASE_URL.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      # Database tests run on in-memory PGlite and apply every migration in ./drizzle
      - run: pnpm test --maxWorkers=2

  # Vercel builds and deploys main through its Git integration. This job applies pending Drizzle migrations to the
  # production Neon database at the same time, so the schema doesn't lag behind the deployed code.
  migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production-migrate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require the production database secret
        # Without it db-migrate.mts falls back to the embedded local database and "succeeds" without touching production
        run: test -n "$DATABASE_URL_UNPOOLED" || { echo "::error::Secret DATABASE_URL_UNPOOLED is not set in the production environment"; exit 1; }
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      - run: pnpm db:migrate
        env:
          # Direct (unpooled) Neon connection string; migrations need session state the pooler doesn't keep
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          NEON_BRANCH: production
