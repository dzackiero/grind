<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0f0c">
  <title>Offline · Grind</title>
  <style>
    :root { --bg: #f3f4ef; --card: #ffffff; --ink: #121410; --muted: #565c51; --accent: #c8f135; --on-accent: #121410; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0d0f0c; --card: #171a16; --ink: #f0f2eb; --muted: #a7ad9f; color-scheme: dark; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: 100%; max-width: 360px; background: var(--card); border-radius: 20px; padding: 28px 24px; display: flex; flex-direction: column; gap: 16px; }
    .mark { width: 40px; height: 40px; }
    h1 { margin: 0; font-size: 26px; line-height: 1.15; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance; }
    p { margin: 0; color: var(--muted); line-height: 1.5; }
    button { margin-top: 4px; height: 48px; border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: 600 16px/1 inherit; font-family: inherit; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <circle cx="16" cy="16" r="16" fill="#c8f135"/>
      <circle cx="16" cy="16" r="10" fill="none" stroke="rgba(18,20,16,.25)" stroke-width="3"/>
      <circle cx="16" cy="16" r="4" fill="#121410"/>
    </svg>
    <h1>You're offline</h1>
    <p>Grind loads your plan and training from the internet. Check your signal and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
